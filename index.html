<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RJ Ops Portal</title>
<style>
  :root{
    --accent:#3E6FB0;
    --bg:#F5F4F1; --surface:#FFFFFF; --fill:#ECEBE7; --fill2:#E2E0DA;
    --line:#DEDCD5; --text:#1C1B19; --muted:#716F68; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh;}

  #login{min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px;}
  #login h1{font-size:13px; letter-spacing:.1em; color:var(--muted); text-transform:uppercase; font-weight:600; margin:0;}
  #login .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:32px 36px; width:300px; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.06);}
  #login input{width:100%; margin-top:10px; padding:11px 12px; font-size:14px; background:var(--fill); border:1px solid var(--line); border-radius:8px; color:var(--text);}
  #login button{width:100%; margin-top:12px; padding:11px; background:var(--accent); border:none; border-radius:8px; color:#fff; font-weight:600; cursor:pointer;}
  #err{color:#B3423B; font-size:13px; min-height:16px; margin-top:8px;}

  #app{display:none; min-height:100vh;}
  .shell{display:flex; min-height:100vh;}
  .sidebar{width:200px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--line); padding:24px 16px; display:flex; flex-direction:column;}
  .brand{font-size:15px; font-weight:700; padding:0 8px 20px;}
  .brand span{display:block; font-size:11px; font-weight:500; color:var(--muted); margin-top:2px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; color:var(--muted); margin-bottom:2px;}
  .nav-item.active, .nav-item:hover{background:var(--fill); color:var(--text);}
  .sidebar-foot{margin-top:auto; font-size:12px; color:var(--muted); cursor:pointer; padding:10px;}
  .main{flex:1; padding:32px 40px; max-width:860px;}
  .view{display:none;}
  .view.active{display:block;}
  .head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px;}
  .head h2{font-size:22px; margin:0; font-weight:700;}
  .head p{font-size:13px; color:var(--muted); margin:5px 0 0;}
  .badge{font-size:11px; padding:5px 10px; border-radius:20px; background:var(--fill2); color:var(--text);}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px;}
  .proj{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; cursor:pointer; transition:.15s;}
  .proj:hover{border-color:var(--accent);}
  .proj .n{font-size:14px; font-weight:700;}
  .proj .s{font-size:11px; color:var(--muted); margin-top:8px; text-transform:capitalize;}
  .add-proj{border:1.5px dashed var(--line); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; color:var(--muted); font-weight:600; font-size:13px; cursor:pointer; min-height:78px;}
  .add-proj:hover{border-color:var(--accent); color:var(--accent);}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px;}
  .field{margin-bottom:16px; max-width:420px;}
  .field label{font-size:11px; color:var(--muted); display:block; margin-bottom:6px; font-weight:700; text-transform:uppercase;}
  .field input, .field select, .field textarea{width:100%; padding:11px 12px; background:var(--surface); border:1px solid var(--line); border-radius:8px; color:var(--text); font-size:14px; font-family:inherit;}
  .field textarea{min-height:100px; resize:vertical;}
  .save{padding:10px 18px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer;}
  .danger{padding:10px 16px; border-radius:8px; border:1px solid #B3423B; background:transparent; color:#B3423B; font-weight:600; cursor:pointer; font-size:13px;}
  .back{font-size:13px; color:var(--muted); cursor:pointer; margin-bottom:16px; display:inline-block;}
  .foot{font-size:12px; color:var(--muted); margin-top:10px;}
  .saved{font-size:12px; color:#3E8B57; margin-left:10px; opacity:0; transition:opacity .2s;}
</style>
</head>
<body>

<div id="login">
  <h1>RJ Ops Portal</h1>
  <div class="card">
    <div style="font-size:13px; color:var(--muted); margin-bottom:4px;">Sign in</div>
    <input id="email" type="email" placeholder="email">
    <input id="password" type="password" placeholder="password">
    <button onclick="doLogin()">Sign in</button>
    <div id="err"></div>
  </div>
</div>

<div id="app">
<div class="shell">
  <div class="sidebar">
    <div class="brand">RJ Ops Portal<span id="userEmail"></span></div>
    <div class="nav-item active" data-view="hub" onclick="switchView('hub')">Hub</div>
    <div class="nav-item" data-view="detail" style="display:none;"></div>
    <div class="sidebar-foot" onclick="doLogout()">Sign out</div>
  </div>
  <div class="main">

    <div id="view-hub" class="view active">
      <div class="head"><div><h2>Hub</h2><p>Live data from your Firestore project</p></div><span class="badge" id="countBadge"></span></div>
      <div id="loadingMsg" class="foot">Loading projects…</div>
      <div class="grid" id="grid"></div>
    </div>

    <div id="view-detail" class="view">
      <span class="back" onclick="switchView('hub')">&larr; back to hub</span>
      <div class="field"><label>Project name</label><input id="f-name"></div>
      <div class="field"><label>Status</label>
        <select id="f-status">
          <option value="planning">Planning</option><option value="building">Building</option>
          <option value="live">Live</option><option value="paused">Paused</option>
        </select>
      </div>
      <div class="field"><label>Notes</label><textarea id="f-notes"></textarea></div>
      <button class="save" onclick="saveProject()">Save to Firestore</button>
      <button class="danger" onclick="deleteProject()" style="margin-left:8px;">Delete</button>
      <span class="saved" id="savedMsg">Saved</span>
    </div>

  </div>
</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, doc, setDoc, deleteDoc, addDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAqRnISdxfOoyGWXYX2RHyvfNYO1hhCY_0",
    authDomain: "rj-ops-portal.firebaseapp.com",
    projectId: "rj-ops-portal",
    storageBucket: "rj-ops-portal.firebasestorage.app",
    messagingSenderId: "422887869537",
    appId: "1:422887869537:web:60998bbcc5eaa436042e20"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let projects = [];
  let activeId = null;

  window.doLogin = function(){
    const email = document.getElementById("email").value.trim();
    const pw = document.getElementById("password").value;
    signInWithEmailAndPassword(auth, email, pw)
      .catch(err => { document.getElementById("err").textContent = err.message; });
  };
  window.doLogout = function(){ signOut(auth); };

  onAuthStateChanged(auth, user => {
    if(user){
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      document.getElementById("userEmail").textContent = user.email;
      loadProjects();
    } else {
      document.getElementById("app").style.display = "none";
      document.getElementById("login").style.display = "flex";
    }
  });

  async function loadProjects(){
    document.getElementById("loadingMsg").style.display = "block";
    const snap = await getDocs(collection(db, "projects"));
    projects = [];
    snap.forEach(d => projects.push({ id: d.id, ...d.data() }));
    document.getElementById("loadingMsg").style.display = "none";
    renderHub();
  }

  window.switchView = function(name){
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById("view-"+name).classList.add("active");
  };

  function renderHub(){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    projects.forEach(p => {
      const d = document.createElement("div");
      d.className = "proj";
      d.onclick = () => showDetail(p.id);
      d.innerHTML = '<div class="n">'+p.name+'</div><div class="s">'+p.status+'</div>';
      grid.appendChild(d);
    });
    const addCard = document.createElement("div");
    addCard.className = "add-proj";
    addCard.textContent = "+ Add project";
    addCard.onclick = addProject;
    grid.appendChild(addCard);
    document.getElementById("countBadge").textContent = projects.length + " projects";
  }

  window.addProject = async function(){
    const name = prompt("New project name:");
    if(!name || !name.trim()) return;
    const ref = await addDoc(collection(db, "projects"), { name: name.trim(), status: "planning", notes: "" });
    projects.push({ id: ref.id, name: name.trim(), status: "planning", notes: "" });
    renderHub();
  };

  window.showDetail = function(id){
    activeId = id;
    const p = projects.find(x => x.id === id);
    document.getElementById("f-name").value = p.name;
    document.getElementById("f-status").value = p.status;
    document.getElementById("f-notes").value = p.notes || "";
    switchView("detail");
  };

  window.saveProject = async function(){
    const p = projects.find(x => x.id === activeId);
    p.name = document.getElementById("f-name").value.trim() || p.name;
    p.status = document.getElementById("f-status").value;
    p.notes = document.getElementById("f-notes").value;
    await setDoc(doc(db, "projects", activeId), { name: p.name, status: p.status, notes: p.notes });
    const msg = document.getElementById("savedMsg");
    msg.style.opacity = 1;
    setTimeout(() => msg.style.opacity = 0, 1200);
    renderHub();
  };

  window.deleteProject = async function(){
    if(!confirm("Delete this project from Firestore?")) return;
    await deleteDoc(doc(db, "projects", activeId));
    projects = projects.filter(x => x.id !== activeId);
    switchView("hub");
    renderHub();
  };
</script>

</body>
</html>
